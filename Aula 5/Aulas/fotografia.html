<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Douglas Matos Fotografia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        body {
            background: linear-gradient(rgba(15, 15, 15, 0.85), rgba(15, 15, 15, 0.85)), url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f8f9fa;
            font-family: 'Outfit', sans-serif;
        }

        .navbar-brand {
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 1.5rem;
            color: #ffffff !important;
        }

        .gallery-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 15px 60px;
        }

        .header-title {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 10px;
            font-weight: 300;
            font-size: 2.5rem;
        }

        .subtitle {
            text-align: center;
            color: #a0a0a0;
            margin-bottom: 50px;
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .thumbnail-row {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
        }

        .thumbnail-item {
            position: relative;
            width: 300px;
            height: 300px;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .thumbnail-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .thumbnail-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
        }

        .thumbnail-item:hover img {
            transform: scale(1.08);
        }

        .thumbnail-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.2) 100%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding-bottom: 30px;
        }

        .thumbnail-item:hover .thumbnail-overlay {
            opacity: 1;
        }

        .thumbnail-title {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
        }

        .modal-content {
            background-color: #121212;
            border: 1px solid #333;
            border-radius: 16px;
            overflow: hidden;
        }

        .modal-header {
            border-bottom: 1px solid #2a2a2a;
            background-color: #0d0d0d;
        }

        .modal-title {
            font-weight: 400;
            letter-spacing: 1px;
            color: #eaeaea;
        }

        .btn-close {
            filter: invert(1);
        }

        .carousel {
            background-color: #000;
        }

        .carousel-item img {
            object-fit: contain;
            height: 70vh;
            min-height: 700px;
            width: 100%;
            background-color: #000;
        }

        /* Audio Container Customization */
        .audio-container {
            background-color: #080808;
            padding: 15px 20px;
            text-align: center;
            border-top: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .audio-container p {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .audio-container audio {
            width: 100%;
            max-width: 600px;
            height: 40px;
            outline: none;
            border-radius: 20px;
        }

        audio::-webkit-media-controls-panel {
            background-color: #1a1a1a;
        }

        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display {
            color: #fff;
        }
    </style>
</head>

<body>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        document.querySelectorAll('.modal').forEach(function (modal) {
            // Tocar o áudio automaticamente quando o modal for aberto
            modal.addEventListener('shown.bs.modal', function () {
                var audio = modal.querySelector('audio');
                if (audio) {
                    audio.play().catch(function (error) {
                        console.log("Autoplay bloqueado pelo navegador:", error);
                    });
                }
            });

            // Pausar o áudio automaticamente quando o modal for fechado
            modal.addEventListener('hidden.bs.modal', function () {
                var audio = modal.querySelector('audio');
                if (audio) {
                    audio.pause();
                }
            });
        });
    </script>
</body>

</html>
