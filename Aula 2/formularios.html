<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Formulários</h1>
    <form action="">
        <label>Texto:</label>
        <input type="text" placeholder="Digite seu texto"><br>
        <label>Número:</label>
        <input type="number" min="0" max="100" step="1" value="50"><br>
        <label>Senha:</label>
        <input type="password" placeholder="Digite sua senha"><br>
        <label>Range:</label>
        <input type="range"><br>
        <label>Data:</label>
        <input type="date" value="2026-02-19"><br>
        <label>Data e Hora:</label>
        <input type="datetime-local" value="2026-02-19T12:00"><br>
        <labe>Semana:</labe>
        <input type="week"><br>
        
    </form>
    
</body>
</html>
